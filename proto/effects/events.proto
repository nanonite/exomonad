syntax = "proto3";
package exomonad.effects.events;

message WaitForEventRequest {
  repeated string types = 1;
  int32 timeout_secs = 2;
  uint64 after_event_id = 3;  // Skip events with id <= this value. 0 means no filtering.
}

message WaitForEventResponse {
  Event event = 1;
}

message NotifyEventRequest {
  string session_id = 1;
  Event event = 2;
}

message NotifyEventResponse {
  bool success = 1;
}

message Event {
  uint64 event_id = 3;  // Monotonically increasing ID assigned by EventQueue
  oneof event_type {
    AgentMessage agent_message = 1;
    Timeout timeout = 2;
    IssueClosed issue_closed = 4;
  }
}

// Agent message notification
message AgentMessage {
  string agent_id = 1;
  string status = 2;
  repeated string changes = 3;
  string message = 4;
}

message Timeout {
  int32 timeout_secs = 1;
}

message IssueClosed {
  uint64 issue_id = 1;
  string closed_by = 2;
}

// ============================================================================
// Address - Typed address for agent-to-agent messaging
// ============================================================================

message Address {
  oneof kind {
    string agent = 1;        // direct by name
    TeamAddress team = 2;    // team-scoped (member or lead)
  }
}

message TeamAddress {
  string team = 1;
  string member = 2;        // specific member; empty = team lead
}

// ============================================================================
// SendMessage - Send message to another agent
// ============================================================================

message SendMessageRequest {
  Address recipient = 1;    // typed address
  string content = 2;       // message body
  string summary = 3;       // brief summary for inbox preview
}

message SendMessageResponse {
  bool success = 1;
  string delivery_method = 2;  // "teams_inbox", "unix_socket", "tmux_stdin", "failed"
}

message SendTmuxMessageRequest {
  Address recipient = 1;    // typed address
  string content = 2;       // message body
  string summary = 3;       // brief summary for traces
}

message SendTmuxMessageResponse {
  bool success = 1;
  string delivery_method = 2;  // "tmux_stdin" or "failed"
}

message SendMailboxMessageRequest {
  Address recipient = 1;    // typed address
  string content = 2;       // message body
  string summary = 3;       // brief summary for inbox preview
}

message SendMailboxMessageResponse {
  bool success = 1;
  string delivery_method = 2;  // "teams_inbox" or "failed"
}

// ============================================================================
// NotifyParent - Notify parent session of worker completion
// ============================================================================

enum TaskBlockCause {
  TASK_BLOCK_CAUSE_UNSPECIFIED = 0;
  TASK_BLOCK_CAUSE_BASE_CI_UNSTABLE = 1;
  TASK_BLOCK_CAUSE_EXTERNAL_DEPENDENCY = 2;
  TASK_BLOCK_CAUSE_SCOPE_BOUNDARY = 3;
  TASK_BLOCK_CAUSE_HUMAN_DECISION_REQUIRED = 4;
  TASK_BLOCK_CAUSE_TOOLING_UNAVAILABLE = 5;
}

message TaskBlockedEvidence {
  string base_sha = 1;
  string head_sha = 2;
  repeated string failed_checks = 3;
  string evidence_summary = 4;
}

message TaskBlocked {
  TaskBlockCause cause = 1;
  bool needs_human = 2;
  string scope_attribution = 3;
  bool retryable = 4;
  string recovery_action = 5;
  TaskBlockedEvidence evidence = 6;
  string slice_id = 7;
  string declared_difficulty = 8;
  string matched_difficulty_rule = 9;
  uint32 attempt = 10;
}

message NotifyParentRequest {
  string status = 1;    // "success" | "failure" | "blocked"
  string message = 2;   // completion message
  string agent_id = 3;  // identity of the notifying agent
  Address override_recipient = 4;  // optional: bypass default supervisor routing
  oneof task_outcome {
    TaskBlocked blocked = 5;
  }
}

message NotifyParentResponse {
  bool ack = 1;
}

service EventEffects {
  rpc WaitForEvent(WaitForEventRequest) returns (WaitForEventResponse);
  rpc NotifyEvent(NotifyEventRequest) returns (NotifyEventResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc SendTmuxMessage(SendTmuxMessageRequest) returns (SendTmuxMessageResponse);
  rpc SendMailboxMessage(SendMailboxMessageRequest) returns (SendMailboxMessageResponse);
  rpc NotifyParent(NotifyParentRequest) returns (NotifyParentResponse);
}
