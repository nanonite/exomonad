syntax = "proto3";
package exomonad.effects.agent;

import "exomonad/common.proto";

// Agent control effects for spawning, monitoring, and cleanup.

// ============================================================================
// Common types
// ============================================================================

// Type of LLM agent.
enum AgentType {
  AGENT_TYPE_UNSPECIFIED = 0;
  AGENT_TYPE_CLAUDE = 1;
  // Retired harness; wire value 2 is retained for compatibility with historical messages.
  AGENT_TYPE_RETIRED = 2;
  AGENT_TYPE_SHOAL = 3;
  AGENT_TYPE_OPENCODE = 4;
  AGENT_TYPE_CODEX = 5;
}

// Topology of the workspace.
enum WorkspaceTopology {
  WORKSPACE_TOPOLOGY_UNSPECIFIED = 0;
  WORKSPACE_TOPOLOGY_WORKTREE_PER_AGENT = 1;
  WORKSPACE_TOPOLOGY_SHARED_DIR = 2;
}

// Information about a spawned agent.
message AgentInfo {
  // Unique identifier (issue number + agent type).
  string id = 1;
  // Issue number this agent is working on.
  string issue = 2;
  // Path to git worktree.
  string worktree_path = 3;
  // Git branch name.
  string branch_name = 4;
  // Agent type.
  AgentType agent_type = 5;
  // Agent role (dev/tl/pm).
  exomonad.common.Role role = 6;
  // Whether the agent's tmux window/pane is alive.
  bool alive = 7;
  // Multiplexer window name (if running).
  string mux_window = 8;
  // Error message (if failed).
  string error = 9;
  // PR number if one was filed.
  int32 pr_number = 10;
  // PR URL if one was filed.
  string pr_url = 11;
  // Workspace topology.
  WorkspaceTopology topology = 12;
  // Stable tmux pane id for ephemeral worker panes (e.g. "%42").
  string pane_id = 13;
  // Branch the agent was spawned from.
  string birth_branch = 14;
  // Whether the agent has unread durable inbox mail.
  bool has_unread = 15;
  // Unix timestamp for the agent's last explicit inbox check.
  int64 last_check_inbox_at = 16;
  // Alias for alive used by agent-list tools.
  bool is_alive = 17;
  // Unix timestamp for lifecycle activity or PR-resume refresh.
  // This is distinct from last_check_inbox_at, which only records check_inbox.
  int64 last_activity_at = 18;
}

// ============================================================================
// Spawn - Spawn a single agent
// ============================================================================

message SpawnRequest {
  // GitHub issue number (e.g., "123").
  string issue = 1;
  // Repository owner.
  string owner = 2;
  // Repository name.
  string repo = 3;
  // Agent type (default: Claude).
  AgentType agent_type = 4;
  // Agent role (default: dev).
  exomonad.common.Role role = 5;
  // Base directory for worktrees (default: .exo/worktrees).
  string worktree_dir = 6;
  // Sub-repository path relative to project_dir (e.g., "urchin/").
  // When set, git worktree operations target this directory instead of project_dir.
  string subrepo = 7;
  // Workspace topology.
  WorkspaceTopology topology = 8;
  // Branch to create worktree from (default: main).
  string base_branch = 9;
  // Inline prompt context (alternative to issue body).
  string context = 10;
}

message SpawnResponse {
  AgentInfo agent = 1;
}

// ============================================================================
// SpawnBatch - Spawn multiple agents
// ============================================================================

message SpawnBatchRequest {
  // Issue numbers to spawn agents for.
  repeated string issues = 1;
  // Repository owner.
  string owner = 2;
  // Repository name.
  string repo = 3;
  // Agent type (default: Claude).
  AgentType agent_type = 4;
  // Agent role (default: dev).
  exomonad.common.Role role = 5;
  // Base directory for worktrees.
  string worktree_dir = 6;
  // Sub-repository path relative to project_dir (e.g., "urchin/").
  // When set, git worktree operations target this directory instead of project_dir.
  string subrepo = 7;
  // Workspace topology.
  WorkspaceTopology topology = 8;
}

message SpawnBatchResponse {
  // Successfully spawned agents.
  repeated AgentInfo agents = 1;
  // Errors for failed spawns (parallel to issues list).
  repeated string errors = 2;
}

// ============================================================================
// Cleanup - Clean up a single agent
// ============================================================================

message CleanupRequest {
  // Issue identifier to clean up.
  string issue = 1;
  // Force cleanup even with uncommitted changes.
  bool force = 2;
  // Sub-repository path relative to project_dir.
  string subrepo = 3;
}

message CleanupResponse {
  // True if cleanup succeeded.
  bool success = 1;
  // Error message if cleanup failed.
  string error = 2;
}

// ============================================================================
// DisposeOrphan - Remove stale resources for a dead orphan agent
// ============================================================================

message DisposeOrphanRequest {
  // Agent slug to clean when sweep is false.
  string agent_slug = 1;
  // Require a dead window, clean worktree, and merged/closed PR before cleanup.
  bool verify_pr_state = 2;
  // Report the verification result without disposing resources.
  bool dry_run = 3;
  // Verify and clean every worktree whose agent window is dead.
  bool sweep = 4;
}

message DisposeOrphanResponse {
  bool removed_worktree = 1;
  bool removed_agent_dir = 2;
  string message = 3;
  // PR state used by verified cleanup (for example, "merged" or "closed").
  string pr_state = 4;
  // PR number used by verified cleanup.
  uint64 pr_number = 5;
  // Whether the safety checks completed successfully.
  bool verified = 6;
  // Whether this response describes a dry run.
  bool dry_run = 7;
  // Agent slugs disposed during a sweep.
  repeated string cleaned_agents = 8;
  // Agent slugs refused during a sweep.
  repeated string skipped_agents = 9;
  // Per-agent errors from a sweep.
  repeated string errors = 10;
}

// ============================================================================
// CleanupBatch - Clean up multiple agents
// ============================================================================

message CleanupBatchRequest {
  // Issue identifiers to clean up.
  repeated string issues = 1;
  // Force cleanup even with uncommitted changes.
  bool force = 2;
  // Sub-repository path relative to project_dir.
  string subrepo = 3;
}

message CleanupBatchResponse {
  // Successfully cleaned up issue IDs.
  repeated string cleaned = 1;
  // Failed issue IDs.
  repeated string failed = 2;
  // Error messages (parallel to failed list).
  repeated string errors = 3;
}

// ============================================================================
// CleanupMerged - Clean up agents whose branches are merged
// ============================================================================

message CleanupMergedRequest {
  // Optional: only check specific issues.
  repeated string issues = 1;
  // Sub-repository path relative to project_dir.
  string subrepo = 2;
}

message CleanupMergedResponse {
  // Cleaned up issue IDs.
  repeated string cleaned = 1;
  // Issues that still have open branches.
  repeated string skipped = 2;
  // Error messages for failures.
  repeated string errors = 3;
}

// ============================================================================
// List - List active agents
// ============================================================================

message ListRequest {
  // When true, only return agents with alive=true.
  bool filter_alive_only = 1;
  // Filter by role (optional).
  exomonad.common.Role filter_role = 2;
  // Sub-repository path relative to project_dir.
  string subrepo = 3;
  // Filter by agent type name (optional).
  string filter_type = 4;
}

message ListResponse {
  repeated AgentInfo agents = 1;
}

// ============================================================================
// SpawnWorker - Spawn a worker agent in the current worktree (no branch/worktree)
// ============================================================================

message SpawnWorkerRequest {
  // Human-readable name for the worker.
  string name = 1;
  // Implementation instructions for the agent.
  string prompt = 2;
  // Permission mode for the agent. Empty = --dangerously-skip-permissions.
  string permission_mode = 3;
  // Tool patterns to allow. Empty = no restriction.
  repeated string allowed_tools = 4;
  // Tool patterns to disallow. Empty = no restriction.
  repeated string disallowed_tools = 5;
  // Optional agent type override (default: Codex).
  AgentType agent_type = 6;
}

message SpawnWorkerResponse {
  AgentInfo agent = 1;
}

message Permissions {
  repeated string allow = 1;
  repeated string deny = 2;
}

// ============================================================================
// SpawnSubtree - Spawn a subtree agent (Claude-only) in a new git worktree
// ============================================================================

message SpawnSubtreeRequest {
  // Full prompt/instructions (collapsed task+context).
  string task = 1;
  // Branch name suffix (e.g., "feature-a").
  string branch_name = 2;
  // Parent Claude session ID for --resume --fork-session context inheritance.
  string parent_session_id = 3;
  // Whether to fork the parent's Claude session context into the child.
  // Default false — child starts fresh. Set true to inherit conversation context.
  bool fork_session = 4;
  string role = 5;        // Optional role override (default: "tl")
  AgentType agent_type = 6; // Optional agent type override
  // Permission mode for Claude (e.g., "plan", "default"). Empty = --dangerously-skip-permissions.
  string permission_mode = 7;
  // Tool patterns to allow (e.g., "Read", "Grep"). Empty = no restriction.
  repeated string allowed_tools = 8;
  // Tool patterns to disallow (e.g., "Bash"). Empty = no restriction.
  repeated string disallowed_tools = 9;
  reserved 10, 11;
  reserved "secure_mode", "allowed_read_paths";
  string working_dir = 12;
  Permissions permissions = 13;
  // When true, creates a standalone git repo instead of a worktree.
  // The agent's .git boundary prevents traversal to the parent repository.
  bool standalone_repo = 14;
  // Directories from the parent project to be copied into the agent's worktree.
  repeated string allowed_dirs = 15;
}

message SpawnSubtreeResponse {
  AgentInfo agent = 1;
}

// ============================================================================
// SpawnReviewer - Spawn only a reviewer for an existing PR
// ============================================================================

message SpawnReviewerRequest {
  // Existing PR number to review.
  uint64 pr_number = 1;
  // Spawn even if a reviewer for this PR is already active.
  bool force = 2;
  // Exact PR head SHA that the reviewer must inspect.
  string head_sha = 3;
  // Acceptance criteria composed from TL run state.
  repeated string acceptance_criteria = 4;
}

message SpawnReviewerResponse {
  AgentInfo agent = 1;
  string reviewer_name = 2;
  bool already_active = 3;
}

// ============================================================================
// CleanupReviewerLeaf - Clean stuck reviewer resources for a PR
// ============================================================================

message CleanupReviewerLeafRequest {
  // Existing PR number whose reviewer resources should be cleaned.
  uint64 pr_number = 1;
}

message CleanupReviewerLeafResponse {
  bool success = 1;
  string error = 2;
  uint64 pr_number = 3;
  repeated string cleaned_reviewers = 4;
}

// ============================================================================
// RestartReview - Reset stuck reviewer state and trigger a fresh review cycle
// ============================================================================

message RestartReviewRequest {
  // Existing PR number whose review cycle should be reset.
  uint64 pr_number = 1;
}

message RestartReviewResponse {
  bool success = 1;
  string error = 2;
  uint64 pr_number = 3;
  repeated string cleaned_reviewers = 4;
  bool runtime_state_found = 5;
  bool watcher_state_found = 6;
  bool legacy_review_file_removed = 7;
}

// ============================================================================
// WatcherPrState - Query live Forgejo PR review/CI state for TL diagnostics
// ============================================================================

message WatcherPrStateRequest {
  // Existing PR number to inspect.
  uint64 pr_number = 1;
}

message WatcherPrStateResponse {
  bool success = 1;
  string error = 2;
  uint64 pr_number = 3;
  bool found = 4;
  bool merge_ready = 5;
  string blocker = 6;
  string review_state = 7;
  string ci_status = 8;
  string head_sha = 9;
  string head_branch = 10;
  string base_branch = 11;
  string pr_state = 12;
  bool merged = 13;
  uint32 review_count = 14;
}

// ============================================================================
// SpawnLeafSubtree - Spawn a leaf agent in a new git worktree
// ============================================================================

message SpawnLeafSubtreeRequest {
  // Full prompt/instructions (collapsed task+context).
  string task = 1;
  // Branch name suffix (e.g., "feature-a").
  string branch_name = 2;
  string role = 3;        // Optional role override (default: "dev")
  AgentType agent_type = 4; // Optional agent type override
  // Permission mode for the agent. Empty = --dangerously-skip-permissions.
  string permission_mode = 5;
  // Tool patterns to allow. Empty = no restriction.
  repeated string allowed_tools = 6;
  // Tool patterns to disallow. Empty = no restriction.
  repeated string disallowed_tools = 7;
  reserved 8, 9;
  reserved "secure_mode", "allowed_read_paths";
  // When true, creates a standalone git repo instead of a worktree.
  bool standalone_repo = 10;
  // Directories from the parent project to be copied into the agent's worktree.
  repeated string allowed_dirs = 11;
  // Existing PR number to resume. When set, the host resolves branch and agent ownership.
  uint64 resume_pr_number = 12;
  // Head SHA observed by the caller; the host re-fetches and requires an exact match.
  string expected_head_sha = 13;
}

message SpawnLeafSubtreeResponse {
  AgentInfo agent = 1;
  // Host-verified process handoff metadata. Empty for legacy callers that do
  // not request a leaf invocation result.
  InvocationHandoff invocation = 2;
}

// Evidence for a process invocation started for an issue-owned leaf.
message InvocationHandoff {
  // UUID of the current invocation generation.
  string invocation_id = 1;
  // spawn, resume_pr, or review.
  string trigger = 2;
  // Runtime selected by the host.
  string runtime = 3;
  // Actual branch retained by the issue owner.
  string branch_name = 4;
  // Exact target kind: window or pane.
  string target_type = 5;
  // Stable tmux target ID (@N or %N). Never a root/display-name fallback.
  string target_id = 6;
  // True only when this request created a new invocation generation.
  bool fresh = 7;
  // True only after the host confirmed the exact target remained alive.
  bool ready = 8;
  // started, already_running, startup_failed, or exited_early.
  string outcome = 9;
}


// ============================================================================
// CloseSelf - Close the calling agent's own pane
// ============================================================================

message CloseSelfRequest {
  // Optional reason for closing (logged, not delivered).
  string reason = 1;
}

message CloseSelfResponse {
  bool success = 1;
  string error = 2;
}

// ============================================================================
// CloseWorkerPane - Close an explicit worker pane from the supervising TL/root
// ============================================================================

message CloseWorkerPaneRequest {
  // Stable tmux pane id returned by spawn_worker (e.g. "%42").
  string pane_id = 1;
}

message CloseWorkerPaneResponse {
  bool success = 1;
  string error = 2;
}

// ============================================================================
// CloseReviewerWindow - Close reviewer tmux windows for a PR by window name
// ============================================================================

message CloseReviewerWindowRequest {
  // Existing PR number whose reviewer window(s) should be closed.
  uint64 pr_number = 1;
}

message CloseReviewerWindowResponse {
  bool success = 1;
  string error = 2;
  uint64 pr_number = 3;
  repeated string closed_windows = 4;
}

// ============================================================================
// CloseIssueAndCleanup - Close a Chainlink issue after merged PR cleanup is safe
// ============================================================================

message CloseIssueAndCleanupRequest {
  // Chainlink issue id to close.
  uint64 issue_id = 1;
  // Leaf agent name / worktree slug to dispose.
  string leaf_name = 2;
}

message CloseIssueAndCleanupResponse {
  bool success = 1;
  string error = 2;
  string leaf_name = 3;
  repeated uint64 cleaned_pr_numbers = 4;
}

// ============================================================================
// ReplaceClosedPr - Replace a closed, unmerged PR with a fresh leaf identity
// ============================================================================

message ReplaceClosedPrRequest {
  // Chainlink issue that must remain open and attached to the replacement.
  uint64 chainlink_issue_id = 1;
  // Closed, unmerged Forgejo PR to replace.
  uint64 closed_pr_number = 2;
  // Existing author leaf identity to retire.
  string old_leaf_name = 3;
  // Required fresh author leaf slug; must not match old_leaf_name.
  string new_leaf_name = 4;
  // Complete implementation task for the replacement leaf.
  string replacement_task = 5;
  // Optional agent runtime; unspecified uses the server default.
  AgentType agent_type = 6;
  // Optional operator context to include in the replacement prompt.
  string operator_context = 7;
  // Explicit human approval boundary for retiring the old leaf and PR state.
  bool human_approved = 8;
}

message ReplaceClosedPrResponse {
  bool success = 1;
  string error = 2;
  uint64 chainlink_issue_id = 3;
  uint64 old_pr_number = 4;
  string old_pr_state = 5;
  bool old_pr_merged = 6;
  string old_head_branch = 7;
  string source_head_sha = 8;
  string original_base_branch = 9;
  string old_leaf_name = 10;
  repeated string retired_resources = 11;
  string new_leaf_name = 12;
  string new_branch = 13;
  string worktree_path = 14;
  string spawn_status = 15;
  string next_action = 16;
  bool replacement_already_exists = 17;
}

// ============================================================================
// Service definition
// ============================================================================

service AgentEffects {
  rpc Spawn(SpawnRequest) returns (SpawnResponse);
  rpc SpawnBatch(SpawnBatchRequest) returns (SpawnBatchResponse);
  rpc SpawnWorker(SpawnWorkerRequest) returns (SpawnWorkerResponse);
  rpc SpawnSubtree(SpawnSubtreeRequest) returns (SpawnSubtreeResponse);
  rpc SpawnReviewer(SpawnReviewerRequest) returns (SpawnReviewerResponse);
  rpc CleanupReviewerLeaf(CleanupReviewerLeafRequest) returns (CleanupReviewerLeafResponse);
  rpc RestartReview(RestartReviewRequest) returns (RestartReviewResponse);
  rpc WatcherPrState(WatcherPrStateRequest) returns (WatcherPrStateResponse);
  rpc SpawnLeafSubtree(SpawnLeafSubtreeRequest) returns (SpawnLeafSubtreeResponse);
  rpc Cleanup(CleanupRequest) returns (CleanupResponse);
  rpc DisposeOrphan(DisposeOrphanRequest) returns (DisposeOrphanResponse);
  rpc CleanupBatch(CleanupBatchRequest) returns (CleanupBatchResponse);
  rpc CleanupMerged(CleanupMergedRequest) returns (CleanupMergedResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc CloseSelf(CloseSelfRequest) returns (CloseSelfResponse);
  rpc CloseWorkerPane(CloseWorkerPaneRequest) returns (CloseWorkerPaneResponse);
  rpc CloseReviewerWindow(CloseReviewerWindowRequest) returns (CloseReviewerWindowResponse);
  rpc CloseIssueAndCleanup(CloseIssueAndCleanupRequest) returns (CloseIssueAndCleanupResponse);
  rpc ReplaceClosedPr(ReplaceClosedPrRequest) returns (ReplaceClosedPrResponse);
}
