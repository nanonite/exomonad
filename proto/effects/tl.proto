syntax = "proto3";
package exomonad.effects.tl;

// Controller-owned observability effects.

message EmitEventRequest {
  // One of the declared tl.* aggregate-dimension event types.
  string event_type = 1;
  // Bounded aggregate dimensions encoded as a JSON object.
  bytes payload = 2;
}

message EmitEventResponse {
  // Canonical ledger event identifier assigned by the host.
  string event_id = 1;
  // Monotonic canonical ledger sequence for this event.
  uint64 run_seq = 2;
}

service TlEffects {
  rpc EmitEvent(EmitEventRequest) returns (EmitEventResponse);
}
