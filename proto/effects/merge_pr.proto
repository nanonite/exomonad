syntax = "proto3";
package exomonad.effects.merge_pr;

message MergePrRequest {
  int64 pr_number = 1;
  // Merge strategy: "squash" (default), "merge", "rebase"
  string strategy = 2;
  // Working directory for git operations. Required for agents in worktrees.
  string working_dir = 3;
  // Expected source/base evidence captured immediately before merge.
  string expected_base_sha = 4;
  string expected_head_sha = 5;
  string expected_patch_digest = 6;
  string expected_merge_tree_sha = 7;
  // Durable parent approval reference for a plan-declared aggregate PR.
  // The host resolves this against the active parent RunStore receipt and
  // revalidates policy, caller authority, repository, and live compare proof.
  AggregateApprovalReference aggregate_approval = 8;
}

message AggregateApprovalReference {
  string receipt_id = 1;
  string parent_run_id = 2;
  repeated string parent_scope_path = 3;
  // Candidate map key in the parent RunStore; distinct from manifest scope IDs.
  string candidate_key = 4;
  string controller_epoch = 5;
}

message MergePrResponse {
  bool success = 1;
  string message = 2;
  // True if git fetch was run after merge
  bool git_fetched = 3;
  // Head branch of the merged PR (e.g., "main.feature-a"). Empty if unknown.
  string branch_name = 4;
  // Verified Forgejo head SHA. Empty if the source did not provide one.
  string head_sha = 5;
}

service MergePrEffects {
  rpc MergePr(MergePrRequest) returns (MergePrResponse);
}
