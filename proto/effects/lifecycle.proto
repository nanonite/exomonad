syntax = "proto3";
package exomonad.effects.lifecycle;

import "effects/agent.proto";

// Root-only lifecycle effects for idle convergence and graceful shutdown.

message ServerShutdownEffect {}

message ServerShutdownResult {
  bool success = 1;
  string error = 2;
  string message = 3;
}

service LifecycleEffects {
  rpc ShutdownServer(ServerShutdownEffect) returns (ServerShutdownResult);
}
